name: Dashboard screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'public/**'
      - 'shared/**'
      - 'bridge/store.mjs'
      - 'bridge/dashboard.mjs'
      - 'bridge/studio-settings.mjs'
      - 'scripts/screenshots/**'
      - 'scripts/landing/**'
      - 'landing/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm landing:build
      - uses: actions/upload-artifact@v4
        with:
          name: companion-screenshots-and-landing
          path: |
            docs/images/*.png
            docs/images/manifest.json
            landing-dist/
          retention-days: 14
